<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スカイランタン デジタルチケット</title>
  <link rel="stylesheet" href="/SkyLanthanum/assets/style.css">
</head>
<body class="ticket-page">
  <main class="ticket-card">
    <p class="eyebrow">スカイランタン デジタルチケット</p>
    <h1>チケットURLを確認しています</h1>
    <p class="note">URLの末尾に余分な記号が付いている場合は、自動で正しいページへ移動します。</p>
  </main>
  <script>
    const current = new URL(window.location.href);
    const cleanedPath = current.pathname.replace(/(?:%3E|>)+$/i, "");
    if (cleanedPath !== current.pathname) {
      current.pathname = cleanedPath;
      window.location.replace(current.toString());
    }
  </script>
</body>
</html>
